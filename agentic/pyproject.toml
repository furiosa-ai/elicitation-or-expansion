[project]
name = "agentic-meta-harness"
version = "0.1.0"
description = "Meta-Harness loop for HotpotQA and AppWorld (Base vs Optimized harness study)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.50,<2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "bm25s>=0.3",
    "numba>=0.60",
    "PyStemmer>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "appworld==0.1.3.post1",
    "pytest>=8.0",
]

[tool.uv]
package = false

